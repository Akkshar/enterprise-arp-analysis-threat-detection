<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Calibri, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#241A5C"/>
  <text x="40" y="44" fill="#00A99D" font-size="15" font-weight="bold" letter-spacing="1">NETWORK DESIGN</text>
  <text x="40" y="76" fill="#FFFFFF" font-size="26" font-weight="bold">Enterprise multi-VLAN LAN with IDP sensor</text>
  <rect x="42" y="90" width="70" height="4" fill="#00A99D"/>

  <!-- Router R1 -->
  <rect x="400" y="120" width="160" height="58" rx="8" fill="#2B2552" stroke="#7C4DFF" stroke-width="2"/>
  <text x="480" y="145" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Router R1</text>
  <text x="480" y="166" fill="#DDD8F5" font-size="12" text-anchor="middle">router-on-a-stick · G0/0 trunk</text>

  <!-- Trunk link R1 - SW1 -->
  <line x1="480" y1="178" x2="480" y2="250" stroke="#00A99D" stroke-width="3"/>
  <text x="492" y="218" fill="#00A99D" font-size="11">802.1Q trunk (VLAN 10,20,30)</text>

  <!-- Switch SW1 -->
  <rect x="360" y="250" width="240" height="56" rx="8" fill="#2B2552" stroke="#00A99D" stroke-width="2"/>
  <text x="480" y="273" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Switch SW1 · Catalyst 2960</text>
  <text x="480" y="293" fill="#DDD8F5" font-size="11" text-anchor="middle">DHCP snooping · Dynamic ARP Inspection · port-security</text>

  <!-- IDP sensor on SPAN -->
  <line x1="600" y1="278" x2="790" y2="278" stroke="#FFB020" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="648" y="270" fill="#FFB020" font-size="11">SPAN (all VLANs)</text>
  <rect x="790" y="250" width="140" height="58" rx="8" fill="#140F38" stroke="#FFB020" stroke-width="2"/>
  <text x="860" y="274" fill="#FFB020" font-size="14" font-weight="bold" text-anchor="middle">IDP sensor</text>
  <text x="860" y="294" fill="#DDD8F5" font-size="11" text-anchor="middle">arpguard watch</text>

  <!-- VLAN columns -->
  <!-- VLAN 10 -->
  <line x1="420" y1="306" x2="180" y2="380" stroke="#3D8BFD" stroke-width="2"/>
  <line x1="440" y1="306" x2="320" y2="380" stroke="#3D8BFD" stroke-width="2"/>
  <rect x="110" y="380" width="140" height="56" rx="8" fill="#1B1448" stroke="#3D8BFD" stroke-width="1.5"/>
  <text x="180" y="402" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">PC1</text>
  <text x="180" y="422" fill="#DDD8F5" font-size="12" text-anchor="middle">192.168.10.10</text>
  <rect x="270" y="380" width="140" height="56" rx="8" fill="#1B1448" stroke="#3D8BFD" stroke-width="1.5"/>
  <text x="340" y="402" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">PC2</text>
  <text x="340" y="422" fill="#DDD8F5" font-size="12" text-anchor="middle">192.168.10.20</text>

  <!-- VLAN 20 -->
  <line x1="490" y1="306" x2="510" y2="380" stroke="#00A99D" stroke-width="2"/>
  <rect x="440" y="380" width="150" height="56" rx="8" fill="#1B1448" stroke="#00A99D" stroke-width="1.5"/>
  <text x="515" y="402" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Enterprise Server</text>
  <text x="515" y="422" fill="#DDD8F5" font-size="12" text-anchor="middle">192.168.20.30 (anchor)</text>

  <!-- VLAN 30 -->
  <line x1="540" y1="306" x2="700" y2="380" stroke="#EC4899" stroke-width="2"/>
  <rect x="630" y="380" width="150" height="56" rx="8" fill="#1B1448" stroke="#EC4899" stroke-width="1.5"/>
  <text x="705" y="402" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Guest device</text>
  <text x="705" y="422" fill="#DDD8F5" font-size="12" text-anchor="middle">192.168.30.50</text>

  <!-- VLAN legend -->
  <text x="40" y="492" fill="#DDD8F5" font-size="13" font-weight="bold">Subnets / VLANs</text>
  <rect x="40" y="504" width="14" height="14" fill="#3D8BFD"/>
  <text x="62" y="516" fill="#DDD8F5" font-size="12">VLAN 10 · 192.168.10.0/24 · users (gw .1)</text>
  <rect x="40" y="526" width="14" height="14" fill="#00A99D"/>
  <text x="62" y="538" fill="#DDD8F5" font-size="12">VLAN 20 · 192.168.20.0/24 · servers (gw .1)</text>
  <rect x="40" y="548" width="14" height="14" fill="#EC4899"/>
  <text x="62" y="560" fill="#DDD8F5" font-size="12">VLAN 30 · 192.168.30.0/24 · guest (gw .1)</text>

  <!-- capture note -->
  <rect x="520" y="486" width="400" height="118" rx="8" fill="#2B2552" stroke="#3a3270" stroke-width="1"/>
  <text x="538" y="510" fill="#FFB020" font-size="12" font-weight="bold">CAPTURE &amp; DETECTION</text>
  <text x="538" y="532" fill="#DDD8F5" font-size="12">• Wireshark / Simulation Mode on a PC link filters ARP</text>
  <text x="538" y="552" fill="#DDD8F5" font-size="12">• SW1 mirrors all VLANs to Fa0/24 (SPAN)</text>
  <text x="538" y="572" fill="#DDD8F5" font-size="12">• IDP sensor runs: arpguard watch -i ... --prevent</text>
  <text x="538" y="592" fill="#DDD8F5" font-size="12">• Switch enforces: DAI drops forged ARP, port-security</text>
</svg>
